[project]
name = "geospatial-measurement-api"
version = "0.1.0"
description = "FastAPI service for measuring geospatial features from Shapefiles and KML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "geopandas>=0.14",
    "pyogrio>=0.10",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
geospatial-measurement-api = "geospatial_measurement_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# B008 (function call in default arg) is FastAPI's idiomatic Depends() pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
